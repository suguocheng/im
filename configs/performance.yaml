# 性能优化配置文件
performance:
  # HTTP服务器配置
  http:
    # 连接池配置
    max_connections: 10000
    max_connections_per_host: 100
    idle_connection_timeout: 90s
    connection_timeout: 30s
    read_timeout: 30s
    write_timeout: 30s
    
    # 限流配置
    rate_limit:
      requests_per_second: 100
      burst_size: 200
      
    # 压缩配置
    compression:
      enabled: true
      level: 6  # 1-9, 6是平衡性能和压缩率
      
    # 超时配置
    timeouts:
      request_timeout: 30s
      keep_alive_timeout: 30s

  # WebSocket配置
  websocket:
    # 连接管理
    max_connections: 10000
    heartbeat_interval: 30s
    read_timeout: 60s
    write_timeout: 10s
    
    # 缓冲区配置
    read_buffer_size: 4096
    write_buffer_size: 4096
    
    # 消息处理
    message_buffer_size: 1000
    batch_size: 100
    batch_interval: 100ms

  # 数据库连接池配置
  database:
    mysql:
      max_open_conns: 100
      max_idle_conns: 10
      conn_max_lifetime: 1h
      conn_max_idle_time: 30m
      
    mongodb:
      max_pool_size: 100
      min_pool_size: 5
      max_conn_idle_time: 30m
      
    redis:
      pool_size: 100
      min_idle_conns: 10
      max_retries: 3
      dial_timeout: 5s
      read_timeout: 3s
      write_timeout: 3s
      pool_timeout: 4s
      idle_timeout: 5m

  # 缓存配置
  cache:
    # Redis缓存
    redis:
      default_ttl: 1h
      user_info_ttl: 1h
      group_members_ttl: 30m
      recent_messages_ttl: 7d
      
    # 本地缓存
    local:
      enabled: true
      size: 1000
      ttl: 5m

  # 微服务通信配置
  rpc:
    # 客户端池配置
    client_pool:
      max_connections: 100
      max_connections_per_host: 10
      idle_connection_timeout: 90s
      
    # 熔断器配置
    circuit_breaker:
      failure_threshold: 5
      timeout: 30s
      
    # 重试配置
    retry:
      max_retries: 3
      backoff_multiplier: 2
      initial_delay: 100ms
      max_delay: 5s

  # 消息处理配置
  message:
    # 批量处理
    batch_processing:
      enabled: true
      batch_size: 100
      flush_interval: 100ms
      
    # 消息存储
    storage:
      # Redis存储
      redis:
        max_messages_per_session: 1000
        message_ttl: 7d
        
      # MongoDB存储
      mongodb:
        batch_size: 100
        write_concern: "majority"
        read_concern: "majority"

  # 监控配置
  monitoring:
    # 性能指标
    metrics:
      enabled: true
      port: 9090
      path: "/metrics"
      
    # 健康检查
    health_check:
      enabled: true
      interval: 30s
      timeout: 5s
      
    # 日志配置
    logging:
      level: "info"
      format: "json"
      slow_query_threshold: 1s

  # 安全配置
  security:
    # 请求限制
    request_limits:
      max_request_size: 10MB
      max_upload_size: 50MB
      
    # 频率限制
    rate_limiting:
      enabled: true
      window_size: 1m
      max_requests: 1000
      
    # IP白名单
    ip_whitelist:
      enabled: false
      addresses: []

# 环境特定配置
environments:
  development:
    performance:
      http:
        max_connections: 1000
      websocket:
        max_connections: 1000
      database:
        mysql:
          max_open_conns: 20
          max_idle_conns: 5
          
  production:
    performance:
      http:
        max_connections: 50000
      websocket:
        max_connections: 50000
      database:
        mysql:
          max_open_conns: 200
          max_idle_conns: 20
      monitoring:
        metrics:
          enabled: true